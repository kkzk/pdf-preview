[project]
name = "pdf-preview"
version = "0.3.5"
description = "PDF Previewer for Excel / Word document."
authors = [
	{ name = "kkzk", email = "shohachi.kakizaki@gmail.com" }
]
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
	"pyside6>=6.12",
	"pypdf>=6.0",
	"pywin32>=312",
	"openpyxl>=3.1.5",
	"pyyaml>=6.0.3"
]

[dependency-groups]
dev = [
	"pytest>=9.0",
	"pytest-qt>=4.5"
]

[project.scripts]
pdf-preview = "pdf_preview.__main__:main"

[project.urls]
Homepage = "https://github.com/kkzk/pdf-preview"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pdf_preview"]

[tool.setuptools.package-data]
pdf_preview = ["logging.yaml", "pdfjs-dist/**/*"]
