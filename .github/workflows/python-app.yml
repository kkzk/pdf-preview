name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the project dependencies
      run: uv sync --locked
    - name: Test with pytest
      run: uv run pytest -v
    - name: Build package
      run: uv build
    - name: Check package data
      shell: bash
      run: |
        uv run python -m zipfile -l dist/*.whl | grep "pdf_preview/logging.yaml" > /dev/null
